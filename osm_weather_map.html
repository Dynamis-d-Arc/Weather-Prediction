<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bangkok Rain Probability Heatmap</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3bDX/5kQBp5fNEtYw4p6UENfVh+Yk="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
        margin: 0;
      }

      body {
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      /* Critical Leaflet layout rules, embedded so the map still renders if
         the external Leaflet CSS is blocked or slow to load. */
      .leaflet-container {
        overflow: hidden;
        position: relative;
        background: #ddd;
        outline: 0;
      }

      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }

      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        user-select: none;
        -webkit-user-drag: none;
      }

      .leaflet-tile {
        width: 256px;
        height: 256px;
      }

      .leaflet-pane {
        z-index: 400;
      }

      .leaflet-tile-pane {
        z-index: 200;
      }

      .leaflet-overlay-pane {
        z-index: 400;
      }

      .leaflet-shadow-pane {
        z-index: 500;
      }

      .leaflet-marker-pane {
        z-index: 600;
      }

      .leaflet-tooltip-pane {
        z-index: 650;
      }

      .leaflet-popup-pane {
        z-index: 700;
      }

      .leaflet-control {
        position: relative;
        z-index: 800;
        pointer-events: auto;
      }

      .leaflet-top,
      .leaflet-bottom {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }

      .leaflet-top {
        top: 0;
      }

      .leaflet-right {
        right: 0;
      }

      .leaflet-bottom {
        bottom: 0;
      }

      .leaflet-left {
        left: 0;
      }

      .leaflet-control-zoom {
        margin: 12px;
      }

      .leaflet-control-zoom a {
        display: block;
        width: 30px;
        height: 30px;
        line-height: 30px;
        text-align: center;
        background: #fff;
        border-bottom: 1px solid #ccc;
        color: #111827;
        text-decoration: none;
      }

      .leaflet-control-attribution {
        background: rgba(255, 255, 255, 0.85);
        padding: 2px 6px;
        font-size: 11px;
      }

      .panel {
        position: absolute;
        z-index: 1000;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d7dde5;
        border-radius: 8px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
        padding: 12px;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 16px;
        line-height: 1.2;
      }

      .panel label {
        display: block;
        font-size: 12px;
        color: #475569;
        margin-bottom: 6px;
      }

      .panel select {
        width: 100%;
        height: 34px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 0 8px;
        background: #fff;
      }

      .mode-control {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        margin-top: 10px;
      }

      .mode-control button {
        height: 34px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #f8fafc;
        color: #0f172a;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }

      .mode-control button.active {
        border-color: #2563eb;
        background: #dbeafe;
        color: #1e3a8a;
        font-weight: 700;
      }

      .legend {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
      }

      .legend span {
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 6px;
        background: #f8fafc;
        text-align: center;
      }

      .summary {
        margin-top: 10px;
        font-size: 12px;
        color: #334155;
        line-height: 1.5;
      }

      .popup-title {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .scale {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        margin-top: 10px;
      }

      .scale span:nth-child(1) {
        background: rgba(255, 255, 255, 0.15);
      }

      .scale span:nth-child(2) {
        background: #dbeafe;
      }

      .scale span:nth-child(3) {
        background: #93c5fd;
      }

      .scale span:nth-child(4) {
        background: #3b82f6;
      }

      .scale span:nth-child(5) {
        background: #1d4ed8;
      }

      .weather-icon {
        align-items: center;
        border: 1px solid rgba(15, 23, 42, 0.18);
        border-radius: 999px;
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.2);
        display: flex;
        font-size: 18px;
        height: 34px;
        justify-content: center;
        line-height: 1;
        overflow: hidden;
        width: 34px;
      }

      .weather-icon img {
        display: block;
        height: 30px;
        object-fit: contain;
        width: 30px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <section class="panel">
      <h1>Bangkok Rain Heatmap</h1>
      <label for="hourSelect">Forecast hour</label>
      <select id="hourSelect"></select>
      <div class="mode-control" aria-label="Map display mode">
        <button id="heatmapMode" class="active" type="button">Hue</button>
        <button id="iconMode" type="button">Icons</button>
      </div>
      <div class="scale" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="legend">
        <span>Dry</span>
        <span>Moderate</span>
        <span>Heavy</span>
      </div>
      <div id="summary" class="summary"></div>
    </section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="data/weather_heatmap_points.js"></script>
    <script>
      const data = window.WEATHER_HEATMAP_POINTS;
      const hours = data.metadata.hours;
      const map = L.map("map", {
        zoomControl: true,
      }).setView([13.7563, 100.5018], 10);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      const hourSelect = document.getElementById("hourSelect");
      const summary = document.getElementById("summary");
      const heatmapModeButton = document.getElementById("heatmapMode");
      const iconModeButton = document.getElementById("iconMode");
      let displayMode = "heatmap";

      const HeatmapLayer = L.Layer.extend({
        initialize(points, options = {}) {
          this.points = points;
          this.options = {
            radius: 42,
            blur: 26,
            minOpacity: 0.05,
            maxOpacity: 0.9,
            ...options,
          };
        },

        onAdd(mapInstance) {
          this.map = mapInstance;
          this.canvas = L.DomUtil.create("canvas", "rain-heatmap-layer");
          this.canvas.style.position = "absolute";
          this.canvas.style.pointerEvents = "none";
          this.canvas.style.zIndex = 450;
          mapInstance.getPanes().overlayPane.appendChild(this.canvas);
          mapInstance.on("moveend zoomend resize", this.redraw, this);
          this.redraw();
        },

        onRemove(mapInstance) {
          mapInstance.off("moveend zoomend resize", this.redraw, this);
          this.canvas.remove();
        },

        setPoints(points) {
          this.points = points;
          this.redraw();
        },

        colorFor(value) {
          if (value >= 0.75) return [29, 78, 216];
          if (value >= 0.6) return [37, 99, 235];
          if (value >= 0.45) return [37, 99, 235];
          if (value >= 0.3) return [96, 165, 250];
          return [219, 234, 254];
        },

        redraw() {
          if (!this.map || !this.canvas) return;
          const size = this.map.getSize();
          const topLeft = this.map.containerPointToLayerPoint([0, 0]);
          L.DomUtil.setPosition(this.canvas, topLeft);
          this.canvas.width = size.x;
          this.canvas.height = size.y;

          const ctx = this.canvas.getContext("2d");
          ctx.clearRect(0, 0, size.x, size.y);
          ctx.globalCompositeOperation = "source-over";

          for (const point of this.points) {
            const layerPoint = this.map.latLngToLayerPoint([point.latitude, point.longitude]);
            const x = layerPoint.x - topLeft.x;
            const y = layerPoint.y - topLeft.y;
            const probability = point.probability;
            const radius = this.options.radius;
            const [r, g, b] = this.colorFor(probability);
            const alpha = Math.max(
              this.options.minOpacity,
              Math.min(this.options.maxOpacity, probability),
            );

            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
            gradient.addColorStop(0.55, `rgba(${r}, ${g}, ${b}, ${alpha * 0.42})`);
            gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        },
      });

      let heatmapLayer = new HeatmapLayer([]).addTo(map);
      const iconLayer = L.layerGroup().addTo(map);

      for (const hour of hours) {
        const option = document.createElement("option");
        option.value = hour;
        option.textContent = new Date(hour).toLocaleString([], {
          year: "numeric",
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
        hourSelect.appendChild(option);
      }

      function pct(value) {
        return `${Math.round(value * 100)}%`;
      }

      function colorFor(probability) {
        if (probability >= 0.75) return "#1e3a8a";
        if (probability >= 0.6) return "#2563eb";
        if (probability >= 0.45) return "#60a5fa";
        if (probability >= 0.3) return "#bfdbfe";
        return "#f8fbff";
      }

      function radiusFor(gridCount) {
        return gridCount >= 9 ? 14 : 12;
      }

      function blockIconFor(probability) {
        if (probability >= 0.8) {
          return {
            image: "weather_icons/Thunder%20Storm.png",
            label: "Thunderstorm risk",
          };
        }
        if (probability >= 0.6) {
          return {
            image: "weather_icons/Rain.png",
            label: "Rain likely",
          };
        }
        if (probability >= 0.35) {
          return {
            image: "weather_icons/Cloudly.png",
            label: "Possible rain",
          };
        }
        return {
          image: "weather_icons/Sunny.png",
          label: "Lower rain chance",
        };
      }

      function buildIconBlocks(points) {
        const blocks = new Map();
        const gridColumns = data.metadata.grid_columns || 21;

        for (const point of points) {
          const gridRow = Math.floor((point.grid_number - 1) / gridColumns);
          const gridCol = (point.grid_number - 1) % gridColumns;
          const blockRow = Math.floor(gridRow / 3);
          const blockCol = Math.floor(gridCol / 3);
          const blockId = `${blockRow}-${blockCol}`;

          if (!blocks.has(blockId)) {
            blocks.set(blockId, {
              blockId,
              blockRow,
              blockCol,
              latitudeTotal: 0,
              longitudeTotal: 0,
              probabilityTotal: 0,
              maxProbability: 0,
              minGrid: point.grid_number,
              maxGrid: point.grid_number,
              count: 0,
            });
          }

          const block = blocks.get(blockId);
          block.latitudeTotal += point.latitude;
          block.longitudeTotal += point.longitude;
          block.probabilityTotal += point.probability;
          block.maxProbability = Math.max(block.maxProbability, point.probability);
          block.minGrid = Math.min(block.minGrid, point.grid_number);
          block.maxGrid = Math.max(block.maxGrid, point.grid_number);
          block.count += 1;
        }

        return [...blocks.values()].map((block) => ({
          ...block,
          latitude: block.latitudeTotal / block.count,
          longitude: block.longitudeTotal / block.count,
          meanProbability: block.probabilityTotal / block.count,
        }));
      }

      function renderIcons(points) {
        iconLayer.clearLayers();
        const blocks = buildIconBlocks(points);

        for (const block of blocks) {
          const iconState = blockIconFor(block.meanProbability);
          const marker = L.marker([block.latitude, block.longitude], {
            icon: L.divIcon({
              className: "",
              html: `<div class="weather-icon" title="${iconState.label}"><img src="${iconState.image}" alt="${iconState.label}" /></div>`,
              iconSize: [34, 34],
              iconAnchor: [17, 17],
            }),
          });

          marker.bindPopup(`
            <div class="popup-title">${iconState.label}</div>
            3x3 block: ${block.blockId}<br />
            Grids: ${block.minGrid}-${block.maxGrid}<br />
            Grid count: ${block.count}<br />
            Mean probability: ${pct(block.meanProbability)}<br />
            Max probability: ${pct(block.maxProbability)}
          `);
          marker.addTo(iconLayer);
        }

        return blocks;
      }

      function setDisplayMode(mode) {
        displayMode = mode;
        heatmapModeButton.classList.toggle("active", mode === "heatmap");
        iconModeButton.classList.toggle("active", mode === "icons");
        render(hourSelect.value);
      }

      function render(hour) {
        const points = data.points.filter(
          (point) => point.predicted_rain_hour === hour,
        );

        let probabilityTotal = 0;
        let highCount = 0;
        let moderateCount = 0;
        let lowCount = 0;

        for (const point of points) {
          probabilityTotal += point.probability;
          if (point.probability >= 0.6) highCount += 1;
          else if (point.probability >= 0.35) moderateCount += 1;
          else lowCount += 1;
        }

        let iconBlocks = [];
        if (displayMode === "heatmap") {
          if (!map.hasLayer(heatmapLayer)) heatmapLayer.addTo(map);
          iconLayer.clearLayers();
          heatmapLayer.setPoints(points);
        } else {
          if (map.hasLayer(heatmapLayer)) map.removeLayer(heatmapLayer);
          iconBlocks = renderIcons(points);
        }

        const avgProbability = points.length
          ? probabilityTotal / points.length
          : 0;
        summary.innerHTML = `
          Grid points shown: ${points.length}<br />
          Icon blocks: ${displayMode === "icons" ? iconBlocks.length : "hidden"}<br />
          Average probability: ${pct(avgProbability)}<br />
          High grids: ${highCount}, moderate: ${moderateCount}, low: ${lowCount}
        `;
      }

      heatmapModeButton.addEventListener("click", () => setDisplayMode("heatmap"));
      iconModeButton.addEventListener("click", () => setDisplayMode("icons"));
      hourSelect.addEventListener("change", () => render(hourSelect.value));
      if (hours.length > 0) {
        hourSelect.value = hours[0];
        render(hours[0]);
      }
    </script>
  </body>
</html>
